[tool.ruff]
target-version = "py310"
line-length = 100

exclude = [
    ".git",
    ".venv",
    ".venv-ci",
    "__pycache__",
    "build",
    "dist",
    "instance",
]

# Research notebook is experimental and is not part of production Python CI.
extend-exclude = [
    "research/trials.ipynb",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

ignore = [
    "E501",
]

# app.py deliberately loads environment configuration before importing
# application/provider modules. Those imports must remain below load_dotenv().
[tool.ruff.lint.per-file-ignores]
"app.py" = [
    "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
